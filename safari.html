<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cannot Open Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      cursor: pointer; /* Optional: indicates the page is clickable */
    }

    .error-message {
      color: #7c7c7c;
      font-size: 28px;
      font-weight: 400;
      text-align: center;
      line-height: 1.3;
      max-width: 600px;
      padding: 20px;
      user-select: none; /* Prevents text highlighting on rapid clicks */
    }
  </style>
</head>
<body>
  <div class="error-message">
    Safari cannot open the page because the server cannot be found.
  </div>

  <script>
    const audio = new Audio('https://brankonice1.github.io/4225597c182560b1e4c7b138a11a14f3.mp3');

    document.addEventListener('click', () => {
      audio.currentTime = 0; // Restarts the audio if clicked again while playing
      audio.play().catch(error => {
        console.error("Audio playback failed:", error);
      });
    });
  </script>
</body>
</html>
